# Tool versions are pinned under [tools]; run `mise install` to fetch them.
# Machine-specific settings, such as DISPLAY, go in the git-ignored mise.local.toml.
[tools]
godot = "4.7.2-stable"

[tasks.import]
description = "Import Godot assets"
run = "godot --headless --editor --path . --import"

[tasks.editor]
description = "Open the Godot editor"
run = "godot --editor --path ."

[tasks.play]
description = "Import assets and launch the game"
depends = ["import"]
run = "godot --path ."

# Godot's user folder for tests goes to tests/output/userdata, not the
# player's (Linux; Godot ignores XDG_DATA_HOME on macOS). Saves go to the
# folder tests/lib/fixture.gd gives the game, on every platform.
[tasks.test]
description = "Import assets, then run the headless checks"
depends = ["import"]
env = { XDG_DATA_HOME = "{{ config_root }}/tests/output/userdata" }
run = "tests/run.sh headless"

[tasks."test:native"]
description = "Import assets, then run the native checks (needs Xvfb on Linux or a desktop)"
depends = ["import"]
env = { XDG_DATA_HOME = "{{ config_root }}/tests/output/userdata" }
run = "tests/run.sh native"

[tasks."export:windows"]
description = "Export a single-file Windows build to build/windows/ (needs export templates)"
depends = ["import"]
run = "mkdir -p build/windows && godot --headless --path . --export-release 'Windows Desktop' build/windows/GameOff2026.exe"

[tasks."export:linux"]
description = "Export a single-file Linux build to build/linux/ (needs export templates)"
depends = ["import"]
run = "mkdir -p build/linux && godot --headless --path . --export-release 'Linux' build/linux/GameOff2026.x86_64"

[tasks."export:macos"]
description = "Export an ad-hoc-signed universal macOS app to build/macos/ (needs export templates)"
depends = ["import"]
run = "mkdir -p build/macos && godot --headless --path . --export-release 'macOS' build/macos/GameOff2026.app"
