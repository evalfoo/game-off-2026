name: Release

# Every Monday, build main for Windows, Linux and macOS, upload them to
# itch.io and tag the commit with the next minor version. Weeks without new
# commits skip.
# Run it by hand from the Actions tab to release now, or to ship a patch.
# Needs the BUTLER_API_KEY secret and the ITCH_TARGET variable (user/game).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [minor, patch]
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Next version
    # Off until the ITCH_TARGET variable is set, so a new repo doesn't fail every Monday.
    if: vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # A manual run can pick any branch; only main is released. The version
      # gets its own line so a failing script fails the step instead of
      # looking like a week without changes.
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'minor' }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases only come from main, not $GITHUB_REF"
            exit 1
          fi
          version=$(tools/next_version.sh "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Build and upload v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run test

      # Only this checkout gets the version. The Windows exe's file version
      # falls back to it.
      - name: Stamp the version
        run: sed -i "/^config\/name=/a config/version=\"$VERSION\"" project.godot

      - name: Find the Godot version
        id: godot
        run: echo "version=$(mise current godot | tr - .)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate so the templates are saved even when a
      # later step fails.
      - name: Restore export templates
        id: templates
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ steps.godot.outputs.version }}
          key: godot-templates-${{ steps.godot.outputs.version }}-with-macos
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          tag=$(mise current godot)
          mkdir -p ~/.local/share/godot/export_templates/${{ steps.godot.outputs.version }}
          curl -sSfL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/$tag/Godot_v${tag}_export_templates.tpz"
          unzip -o -j "$RUNNER_TEMP/templates.tpz" \
            templates/version.txt templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
            templates/macos.zip \
            -d ~/.local/share/godot/export_templates/${{ steps.godot.outputs.version }}
      - name: Save export templates
        if: steps.templates.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ steps.godot.outputs.version }}
          key: godot-templates-${{ steps.godot.outputs.version }}-with-macos

      - run: mise run export:windows
      - run: mise run export:linux
      - run: mise run export:macos

      # Re-running an older failed run must not overwrite the same or a newer
      # release, so the version has to beat every released tag.
      - name: Check the version is the newest
        run: |
          tags=$(git ls-remote --tags --refs origin 'refs/tags/v*')
          latest=$(printf '%s\n' "$tags" | sed -n 's|.*refs/tags/v||p' | sort -V | tail -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" = "$latest" ]; then
            echo "::error::v$VERSION isn't newer than the released v$latest"
            exit 1
          fi

      - name: Upload to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          "$RUNNER_TEMP/butler/butler" push build/windows "$ITCH_TARGET:windows" --userversion "$VERSION"
          "$RUNNER_TEMP/butler/butler" push build/linux "$ITCH_TARGET:linux" --userversion "$VERSION"
          # The folder holds the .app, so butler keeps the executable bit.
          "$RUNNER_TEMP/butler/butler" push build/macos "$ITCH_TARGET:mac" --userversion "$VERSION"

      # Tag last, so a failed run leaves no tag and can simply run again.
      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
